<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Common Ground</title>
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../auth.css">
</head>
<body>
<header class="nav"><a class="nav-brand" href="../"><img class="logo" src="../logo.svg" alt=""><span>Common Ground</span></a><nav class="nav-tabs" aria-label="Pages"><a href="../">Overview</a><a href="../dashboard/" data-dash-tab>Dashboard</a></nav><div class="nav-links"></div><div class="nav-user" data-nav-user data-root="../"></div></header>

<main class="auth">
  <div class="auth-card">
    <h1>Sign in</h1>
    <form class="gh" id="gh" novalidate>
      <label class="fld" for="handle"><span>GitHub username</span>
        <span class="gh-in"><span class="cg-lg" id="gh-lg" aria-hidden="true"></span><span class="at">@</span><input id="handle" name="handle" autocomplete="username" autocapitalize="off" spellcheck="false" required maxlength="39" placeholder="octocat"></span>
      </label>
      <button class="btn is-blue is-full" type="submit"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" stroke="none" d="M8 0a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.6 7.6 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.8-3.6 4 .3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 0Z"/></svg>Continue with GitHub</button>
      <p class="err" id="err" role="alert"></p>
    </form>
    <p class="or"><span>or try as</span></p>
    <div class="demo" id="demo"></div>
    <p class="auth-alt">New here? <a href="../join/">Join</a></p>
  </div>
  <p class="auth-fine">Prototype · no passwords · stays in this browser</p>
</main>

<script type="module">import { live } from '../api.js'; await import((await live()) ? './live.js' : './signin.js');</script>
<script type="module" src="../nav.js"></script>
</body>
</html>
